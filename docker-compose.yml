# Paperlib MCP — Docker 部署 (2020-2026 文献管理与检索 MCP 服务器)
# 数据全部落在 D 盘 (D:/paperlib-mcp/...)
# 源码仓库原始 GitHub 地址已失效(占位符)，本部署基于 PyPI 官方包 paperlib-mcp==0.1.5 构造，等效还原文档所述能力。
#
# 前置条件:
#   1. 已安装 Docker Desktop (Windows, WSL2 后端) 并以管理员运行一次完成初始化
#   2. Docker Desktop -> Settings -> Resources -> File Sharing 中勾选 D: 盘 (否则 D:/paperlib-mcp 的卷挂载会失败)
#   3. 准备一个 OpenRouter API Key (https://openrouter.ai/keys)，填进本目录 .env 的 OPENROUTER_API_KEY
#
# 启动:
#   cd D:/paperlib-mcp
#   docker compose up -d
# 查看状态:
#   docker compose ps
# 停止(保留数据):
#   docker compose down
# 停止并清空数据:
#   docker compose down -v
#
# 访问:
#   MinIO 控制台:  http://localhost:9001  (minio / minio123)
#   PostgreSQL:    localhost:5432  (paper / paper / paperlib)
#   MCP 通过 stdio 暴露(见 mcp-workbuddy.json)，不直接监听端口

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: paperlib-postgres
    environment:
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper
      POSTGRES_DB: paperlib
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paperlib"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: paperlib-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    container_name: paperlib-minio-init
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set m http://minio:9000 minio minio123; do sleep 2; done;
             mc mb -p m/paperlib || true;
             exit 0"

  paperlib-mcp:
    build: .
    container_name: paperlib-mcp
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper
      POSTGRES_DB: paperlib
      S3_ENDPOINT: http://minio:9000
      MINIO_BUCKET: paperlib
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./papers:/app/papers
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
